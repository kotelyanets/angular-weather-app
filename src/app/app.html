<div class="weather-container" [ngClass]="weather ? weather.theme : 'default'">
  <div class="weather-card">
    <h1>Weather Forecast</h1>
    
    <div class="search-box">
      <input 
        type="text" 
        [(ngModel)]="cityName" 
        (keyup.enter)="searchWeather()"
        placeholder="Enter city name (e.g. Lisbon)" 
      />
      <button (click)="searchWeather()" [disabled]="loading">
        {{ loading ? 'Loading...' : 'Search' }}
      </button>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div *ngIf="weather" class="weather-info">
      <h2>{{ weather.city }}, {{ weather.country }}</h2>
      <div class="temp">{{ weather.temperature }}°C</div>
      <p class="condition">{{ weather.conditionText }}</p>
      
      <div class="details">
        <div class="detail-item">
          <span>Humidity:</span> <strong>{{ weather.humidity }}%</strong>
        </div>
        <div class="detail-item">
          <span>Wind Speed:</span> <strong>{{ weather.windSpeed }} km/h</strong>
        </div>
      </div>
    </div>
  </div>
</div>
